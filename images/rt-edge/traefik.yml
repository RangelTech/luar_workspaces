entryPoints:
  web:
    address: ":8080"
    transport:
      respondingTimeouts:
        readTimeout: 60s
        idleTimeout: 120s
  ping:
    address: ":8082"
  metrics:
    address: ":8083"
ping:
  entryPoint: ping
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
api:
  dashboard: false
accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        Referer: keep
log:
  level: INFO
metrics:
  prometheus:
    entryPoint: metrics
    addRoutersLabels: true
    addServicesLabels: true
