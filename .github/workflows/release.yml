name: Release
# Publica 4 imagens (docker-archive) + 4 manifestos. NAO faz deploy (so o vps_rt_infra implanta).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (ex.: v0.1.1); cria a tag no commit atual"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Versao
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Gate
        run: VERIFY_SKIP_IMAGE=1 bash scripts/verify.sh
      - name: Build, archive e manifesto de cada servico
        env:
          V: ${{ steps.v.outputs.version }}
        run: python3 scripts/release_build.py "$V"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "$V" ./*.image.tar.gz ./release-manifest.*.json --title "$V" --notes "Artefatos docker-archive (sha256 nos manifestos). Deploy: somente vps_rt_infra." --target "${GITHUB_SHA}" \
            || gh release upload "$V" ./*.image.tar.gz ./release-manifest.*.json --clobber
